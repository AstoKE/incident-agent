[project]
name = "incident-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "langchain>=1.0.0",
  "langgraph>=1.0.0",
  "langchain-ollama>=1.0.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "chromadb>=1.0.0",
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.18.0",
]

[project.optional-dependencies]
qt = ["PySide6>=6.7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
